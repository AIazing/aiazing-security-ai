<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invoice workspace</title>
  <style>
    body { font:16px/1.5 system-ui,sans-serif; margin:40px auto; padding:0 20px; max-width:640px; color:#172333; background:#f5f7fa; }
    main { padding:24px; border:1px solid #ccd5e1; border-radius:12px; background:white; }
    label { display:block; margin:12px 0; }
    input,button { font:inherit; padding:8px; }
    input { display:block; box-sizing:border-box; max-width:100%; }
    button { margin:4px 0; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; }
    .notice { color:#536174; }
  </style>
</head>
<body>
  <main>
    <h1>Invoice workspace</h1>
    <p class="notice">Local research fixture. All accounts and invoices are synthetic.</p>
    <form id="login">
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
    </form>
    <section id="workspace" hidden>
      <p id="identity"></p>
      <h2>Your invoices</h2>
      <ul id="invoices"></ul>
      <pre id="record"></pre>
      <button id="logout" type="button">Sign out</button>
    </section>
    <p id="status" role="status"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
